name: Browser frontend smoke tests
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'preview/**'
      - 'tests/**'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify local inquiry workflow
        run: |
          node tests/inquiry-browser.cjs
          node tests/inquiry-delivery.cjs
          node tests/redesign-browser.cjs
          node tests/workspace-browser.cjs
          node tests/waitlist-browser.cjs
      - name: Verify navigation and mobile layouts
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const http=require('http');
          const fs=require('fs');
          const path=require('path');
          const mime={'.html':'text/html','.css':'text/css','.js':'text/javascript','.xml':'application/xml'};
          const server=http.createServer((req,res)=>{
            const pathname=decodeURIComponent(new URL(req.url,'http://localhost').pathname);
            const target=path.resolve('.', '.'+pathname, pathname.endsWith('/')?'index.html':'');
            if(!target.startsWith(process.cwd()+path.sep)){res.writeHead(403).end();return;}
            fs.readFile(target,(err,data)=>{
              if(err){res.writeHead(404).end();return;}
              res.writeHead(200,{'Content-Type':mime[path.extname(target)]||'text/plain'}).end(data);
            });
          });
          (async()=>{
            await new Promise(resolve=>server.listen(8765,'127.0.0.1',resolve));
            const browser=await chromium.launch({headless:true});
            try {
            for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              page.setDefaultTimeout(7000);
              page.setDefaultNavigationTimeout(10000);
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
              if(viewport.width<500)await page.locator('.menu-toggle').click();
              for(const anchor of ['platform','partners']){
                await page.locator('#site-nav a[href="#'+anchor+'"]').click();
                if(!await page.locator('#'+anchor).count())throw Error('Missing section '+anchor);
                if(viewport.width<500 && anchor!=='partners')await page.locator('.menu-toggle').click();
              }
              await page.goto('http://127.0.0.1:8765/blockchain.html');
              if(viewport.width<500)await page.locator('.menu-toggle').click();
              await page.locator('#site-nav a[href="./#platform"]').click();
              if(!page.url().includes('#platform'))throw Error('Blockchain return link broken');
              await page.goto('http://127.0.0.1:8765/preview/index.html');
              for(const route of ['dashboard','inventory','trading','checkout','fulfillment','analytics','blockchain']){
                await page.locator('[data-view="'+route+'"]').click();
                if(!page.url().endsWith('#'+route))throw Error('Preview route failed '+route);
                await page.waitForFunction(key=>document.querySelector('[data-view="'+key+'"]')?.getAttribute('aria-current')==='page',route);
                if(!await page.locator('#content .card').count())throw Error('Empty module '+route);
              }
              // Confirm dashboard-only panels do not leak across exchange modules.
              await page.goto('http://127.0.0.1:8765/preview/index.html#dashboard');
              for(const selector of ['.home-hero','.exchange-overview','.market-panel']){
                if(!await page.locator(selector).isVisible())throw Error('Dashboard panel missing '+selector);
              }
              for(const route of ['inventory','trading','checkout','fulfillment','analytics','blockchain']){
                await page.locator('[data-view="'+route+'"]').click();
                await page.waitForFunction(key=>document.querySelector('[data-view="'+key+'"]')?.getAttribute('aria-current')==='page',route);
                for(const selector of ['.home-hero','.exchange-overview','.market-panel']){
                  if(await page.locator(selector).isVisible())throw Error('Dashboard content leaked into '+route+': '+selector);
                }
              }
              // Public Pages is static: never initiate private authenticated metadata calls.
              const apiRequests=[];
              page.on('request',req=>{if(new URL(req.url()).pathname.startsWith('/api/'))apiRequests.push(req.url());});
              await page.goto('http://127.0.0.1:8765/preview/index.html#inventory');
              await page.locator('input[aria-label="Search example assets"]').fill('copper');
              if(await page.locator('.market-table tbody tr').count()!==1)throw Error('Asset search did not filter examples');
              if(apiRequests.length)throw Error('Public frontend unexpectedly requested private API');
              // Exercise the dormant private API adapter with a mock, never a live request.
              const contract=await page.evaluate(async()=>{
                const calls=[];
                const mock=async(url,options)=>{
                  calls.push({url,options});
                  return {ok:true,json:async()=>({kind:'inventory_batch',resource_id:'example-1',organization_id:'org-1',read_only:true,secret:'must-not-leak'})};
                };
                const data=await readScopedMetadata('inventory_batch','example-1','test-token',mock);
                let invalidRejected=false,deniedRejected=false;
                try{await readScopedMetadata('trade','../invalid','test-token',mock)}catch(e){invalidRejected=e instanceof TypeError}
                try{await readScopedMetadata('trade','example-2','test-token',async()=>({ok:false,status:403}))}catch(e){deniedRejected=e.message==='Metadata unavailable'}
                return {calls:calls.map(({url,options})=>({url,options:{...options,signalPresent:options.signal instanceof AbortSignal,signal:undefined}})),data,invalidRejected,deniedRejected};
              });
              if(contract.calls.length!==1 || contract.calls[0].url!=='/api/v1/inventory/batches/example-1')throw Error('Metadata route mismatch');
              const opts=contract.calls[0].options;
              if(opts.method!=='GET' || opts.credentials!=='same-origin' || opts.cache!=='no-store' || opts.headers.Authorization!=='Bearer test-token')throw Error('Metadata auth/read-only contract mismatch');
              if(!contract.data.read_only || !contract.invalidRejected || !contract.deniedRejected)throw Error('Metadata safety checks failed');
              if(contract.data.organization_id!=='org-1' || Object.hasOwn(contract.data,'secret'))throw Error('Metadata response allowlist failed');
              const malformed=await page.evaluate(async()=>{
                const mock=async()=>({ok:true,json:async()=>({kind:'trade',resource_id:'example-1',organization_id:'org-1',read_only:false})});
                try{await readScopedMetadata('inventory_batch','example-1','test-token',mock);return false}
                catch(e){return e.message==='Invalid scoped metadata response'}
              });
              if(!malformed)throw Error('Malformed backend response was accepted');
              const transport=await page.evaluate(async()=>{
                const thrown=async()=>{throw new Error('sensitive transport detail')};
                const invalidJson=async()=>({ok:true,json:async()=>{throw new SyntaxError('raw response detail')}});
                const errors=[];
                for(const mock of [thrown,invalidJson]){
                  try{await readScopedMetadata('inventory_batch','example-1','test-token',mock)}
                  catch(e){errors.push(e.message)}
                }
                return errors;
              });
              if(transport.length!==2 || transport.some(message=>message!=='Metadata unavailable'))throw Error('Transport failure leaked internal details');
              if(!opts.signalPresent)throw Error('Metadata timeout signal missing');

              if(apiRequests.length)throw Error('Metadata mock leaked a real API request');

              await page.goto('http://127.0.0.1:8765/preview/index.html#invalid');
              await page.waitForURL('**/preview/index.html#dashboard');
              if(errors.length)throw Error('Browser errors: '+errors.join('; '));
              await page.close();
            }
            console.log('Desktop and mobile browser navigation passed');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1}).finally(()=>server.close());
          JS


      - name: Save workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-workspace-screenshots
          path: screenshots/workspace-*.png
          if-no-files-found: ignore
