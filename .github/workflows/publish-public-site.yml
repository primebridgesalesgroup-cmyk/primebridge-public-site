name: Publish approved public website
# Release trigger: approved A+ frontend and custom-domain configuration.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'wallet.html'
      - 'tests/wallet-release.test.cjs'
      - 'sandbox.html'
      - 'dashboard.html'
      - 'dashboard.js'
      - 'portfolio.js'
      - 'access.js'
      - 'signin.html'
      - 'ledger-theme.css'
      - 'workspace.css'
      - 'styles.css'
      - 'site.js'
      - 'blockchain.html'
      - 'milestones.html'
      - 'services.html'
      - 'privacy.html'
      - 'inquiry.js'
      - 'inquiry-delivery.js'
      - 'waitlist.html'
      - 'waitlist.js'
      - 'waitlist-privacy.html'
      - 'preview/**'
      - 'assets/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'CNAME'
      - '.nojekyll'
      - '.github/workflows/publish-public-site.yml'
      - 'scripts/build-public.py'
      - '_config.yml'
      - '404.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out approved public repository
        uses: actions/checkout@v4
      - name: Verify wallet cannot sign or transfer
        run: node tests/wallet-release.test.cjs
      - name: Build the ready customer release
        run: python3 scripts/build-public.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload approved public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

