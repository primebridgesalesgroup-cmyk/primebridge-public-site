name: Public artifact security gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test release guard
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests -p test_release_security.py -v
      - name: Build customer release
        run: python3 scripts/build-public.py
      - name: Inspect published files for secrets and executable artifacts
        run: python3 scripts/release_security.py _public
